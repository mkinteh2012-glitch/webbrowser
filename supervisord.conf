[supervisord]
nodaemon=true

[program:xvfb]
command=Xvfb :1 -screen 0 1280x800x24 -ac
autorestart=true
priority=1

[program:openbox]
command=openbox
environment=DISPLAY=":1"
autorestart=true
priority=2

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -rfbport 5900 -nopw
autorestart=true
priority=3

[program:chromium]
command=bash -c "sleep 2 && google-chrome-stable --no-sandbox --disable-gpu --disable-dev-shm-usage --start-maximized --window-position=0,0 --user-data-dir=/root/.chrome-profile"
environment=DISPLAY=":1"
autorestart=true
priority=4

[program:websockify]
command=websockify --web=/usr/share/novnc 8080 localhost:5900
autorestart=true
priority=5